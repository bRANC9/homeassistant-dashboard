title: Pool
path: pool
icon: mdi:pool
type: sections
theme: Helios
max_columns: 12
sections:
  # ── Pool Status ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F3CA Medence"
        subtitle: "{{ states('sensor.pool_pump_status_text') }}"
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: switch.medence_szivattyu_biztositek
          name: Szivattyú
          icon: mdi:water-pump
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.medence_cso_homero_probe_temperature') }}°C"
          secondary: Water
          icon: mdi:thermometer-water
          icon_color: "{{ 'red' if states('sensor.medence_cso_homero_probe_temperature')|float(0) > 28 else 'orange' if states('sensor.medence_cso_homero_probe_temperature')|float(0) > 22 else 'green' if states('sensor.medence_cso_homero_probe_temperature')|float(0) > 16 else 'blue' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('input_number.medence_utolso_homerseklet') }}°C"
          secondary: Cached
          icon: mdi:thermometer-check
          icon_color: cyan
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: switch.medence_vilagitas_biztositek
          name: Fény
          icon: mdi:swim
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.medence_szivattyu_biztositek_power') }} W"
          secondary: Power
          icon: mdi:flash
          icon_color: yellow
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('input_number.pool_pump_daily_total_runtime') }}h/8h"
          secondary: Runtime
          icon: mdi:timer
          icon_color: blue
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.medence_cso_homero_battery') }}%"
          secondary: Probe Battery
          icon: mdi:battery
          icon_color: "{{ 'green' if states('sensor.medence_cso_homero_battery')|int(0) > 60 else 'yellow' if states('sensor.medence_cso_homero_battery')|int(0) > 30 else 'red' }}"
        grid_options:
          columns: 4

  # ── Pool Timer ──
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.pool_pump_stop_time') }}"
          secondary: "Stop Time"
          icon: mdi:clock-outline
          icon_color: red
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: action_chip
        variables:
          primary: "+1h"
          secondary: Extend
          icon: mdi:clock-plus
          icon_color: blue
          perform_action: input_button.press
          target_entity: input_button.pool_pump_extend_time
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: action_chip
        variables:
          primary: "-1h"
          secondary: Reduce
          icon: mdi:clock-minus
          icon_color: orange
          perform_action: input_button.press
          target_entity: input_button.pool_pump_reduce_time
        grid_options:
          columns: 4

  # ── Pool Charts ──
  - type: grid
    cards:
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.medence_cso_homero_probe_temperature
            name: Probe
          - entity: input_number.medence_utolso_homerseklet
            name: Cached
        name: "Pool Temp °C"
        hours_to_show: 24
        line_width: 3
        font_size: 75
        animate: true
        grid_options:
          columns: 6

      - type: custom:mini-graph-card
        entities:
          - entity: sensor.medence_szivattyu_biztositek_power
            name: Pump
        name: "Pump Power (W)"
        hours_to_show: 24
        line_width: 3
        font_size: 75
        animate: true
        line_color: blue
        grid_options:
          columns: 6

  # ── Weather ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Időjárás"
        subtitle: ""
        grid_options:
          columns: 12

      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: true
        grid_options:
          columns: 6

      - type: custom:mini-graph-card
        name: Terasz
        hours_to_show: 24
        points_per_hour: 2
        animate: true
        line_width: 4
        show:
          labels: true
          legend: true
        entities:
          - entity: sensor.terasz_homero_temperature
            name: Hőmérséklet
            color: "#00bcd4"
          - entity: sensor.terasz_homero_humidity
            name: Páratartalom
            y_axis: secondary
            color: "#2196f3"
        grid_options:
          columns: 6

  # ── Outdoor ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Kinti terek"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: switch.pince_terasz_hangulat_vilagitas
          name: Terasz fény
          icon: mdi:outdoor-lamp
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: switch.medence_vilagitas_biztositek
          name: Medence fény
          icon: mdi:swim
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.terasz_homero_temperature') }}°C"
          secondary: Terasz
          icon: mdi:thermometer
          icon_color: "rgb(0, 188, 212)"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.medence_cso_homero_probe_temperature') }}°C"
          secondary: Víz
          icon: mdi:thermometer-water
          icon_color: "{{ 'red' if states('sensor.medence_cso_homero_probe_temperature')|float(0) > 28 else 'orange' if states('sensor.medence_cso_homero_probe_temperature')|float(0) > 22 else 'green' if states('sensor.medence_cso_homero_probe_temperature')|float(0) > 16 else 'blue' }}"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.terasz_homero_humidity') }}%"
          secondary: Pára
          icon: mdi:water-percent
          icon_color: "rgb(33, 150, 243)"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.medence_szivattyu_biztositek_power') }} W"
          secondary: Szivattyú
          icon: mdi:water-pump
          icon_color: yellow
        grid_options:
          columns: 4

  # ── Sensor Details ──
  - type: grid
    cards:
      - type: entities
        title: "Szenzorok"
        entities:
          - entity: sensor.medence_cso_homero_probe_temperature
            name: "Víz hőmérséklet"
          - entity: input_number.medence_utolso_homerseklet
            name: "Utolsó mérés"
          - entity: sensor.medence_meres_allapota
            name: "Mérés állapota"
          - entity: sensor.medence_cso_homero_battery
            name: "Szenzor elem"
          - entity: sensor.medence_szivattyu_biztositek_power
            name: "Szivattyú teljesítmény"
          - entity: input_number.pool_pump_daily_total_runtime
            name: "Napi üzemidő"
          - entity: input_datetime.pool_pump_stop_time
            name: "Leállítás időpontja"
        grid_options:
          columns: 12
