title: Energy
path: energy
icon: mdi:lightning-bolt
type: sections
theme: Helios
max_columns: 12
sections:
  # ── Today Overview ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Napi Energia"
        subtitle: >-
          Import: {{ states('sensor.solis_s6_eh3p_today_energy_imported_from_grid') }} kWh |
          Export: {{ states('sensor.solis_s6_eh3p_today_energy_fed_into_grid') }} kWh
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_pv_today_energy_generation') }} kWh"
          - secondary: "PV"
          - icon: mdi:solar-power
          - icon_color: yellow
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_today_energy_consumption') }} kWh"
          - secondary: "Load"
          - icon: mdi:home-lightning-bolt
          - icon_color: blue
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_today_battery_charge_energy') }} kWh"
          - secondary: "Bat Charge"
          - icon: mdi:battery-charging
          - icon_color: green
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_today_battery_discharge_energy') }} kWh"
          - secondary: "Bat Discharge"
          - icon: mdi:battery-minus
          - icon_color: orange
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.pv_forecast_total') }} kWh"
          - secondary: "PV Forecast"
          - icon: mdi:solar-power
          - icon_color: yellow
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.energy_production_today_2') }} kWh"
          - secondary: "Nyugat"
          - icon: mdi:solar-power
          - icon_color: orange
        grid_options:
          columns: 3

  # ── PV Production Chart ──
  - type: grid
    cards:
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          offset: -24h
        header:
          show: true
          title: "PV Power (W)"
        card_height: 200
        series:
          - entity: sensor.solis_s6_eh3p_pv_power_1
            name: "Dél"
            color: "#f4c430"
            unit: W
          - entity: sensor.solis_s6_eh3p_pv_power_2
            name: "Nyugat"
            color: "#ff9800"
            unit: W
        grid_options:
          columns: 12

  # ── Grid Import/Export ──
  - type: grid
    cards:
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          offset: -24h
        header:
          show: true
          title: "Grid & Consumption (W)"
        card_height: 200
        series:
          - entity: sensor.solis_s6_eh3p_meter_total_active_power
            name: "Grid"
            invert: true
            color: "#2196f3"
            unit: W
          - entity: sensor.solis_s6_eh3p_household_load_power
            name: "Fogyasztás"
            color: "#ff5722"
            unit: W
        grid_options:
          columns: 12

  # ── Battery SOC ──
  - type: grid
    cards:
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          offset: -24h
        header:
          show: true
          title: "Battery SOC (%)"
        card_height: 200
        series:
          - entity: sensor.solis_s6_eh3p_battery_soc
            name: "SOC"
            type: column
            color: "#4caf50"
            unit: "%"
        grid_options:
          columns: 12

  # ── Battery Power ──
  - type: grid
    cards:
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          offset: -24h
        header:
          show: true
          title: "Battery Power (W)"
        card_height: 200
        series:
          - entity: sensor.solis_s6_eh3p_battery_power
            name: "Power"
            color: "#ffc0cb"
            unit: W
        grid_options:
          columns: 12

  # ── Household Load ──
  - type: grid
    cards:
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          offset: -24h
        header:
          show: true
          title: "Household Load (W)"
        card_height: 200
        series:
          - entity: sensor.solis_s6_eh3p_household_load_power
            name: "Essential"
            color: "#ff5722"
            unit: W
          - entity: sensor.mert_fogyasztasok
            name: "Measured"
            color: "#ff9800"
            unit: W
          - entity: sensor.nem_mert_fogyasztasok
            name: "Unmeasured"
            color: "#795548"
            unit: W
        grid_options:
          columns: 12

  # ── Power Meter History ──
  - type: grid
    cards:
      - type: custom:mini-graph-card
        name: "Fogyasztások (24h)"
        hours_to_show: 24
        points_per_hour: 2
        animate: true
        line_width: 3
        height: 200
        show:
          labels: true
          legend: true
        entities:
          - entity: sensor.bojler_aram_mero_power
            name: Bojler
            color: "#ff9800"
          - entity: sensor.klima_aram_mero_power
            name: Klíma
            color: "#2196f3"
          - entity: sensor.iroda_aram_mero_power
            name: Iroda
            color: "#4caf50"
          - entity: sensor.pince_huto_power
            name: Pince hűtő
            color: "#795548"
          - entity: sensor.pince_melyhuto_power
            name: Mélyhűtő
            color: "#9c27b0"
          - entity: sensor.konyha_huto_power
            name: Konyha hűtő
            color: "#00bcd4"
          - entity: sensor.mosogep_power
            name: Mosógép
            color: "#f44336"
          - entity: sensor.szaritogep_power
            name: Szárítógép
            color: "#ff5722"
        grid_options:
          columns: 12

  # ── Energy Costs ──
  - type: grid
    cards:
      - type: entities
        title: "Költségek"
        entities:
          - entity: sensor.import_rezsi_kwh
            name: "Rezszi import (kWh)"
          - entity: sensor.import_piaci_kwh
            name: "Piaci import (kWh)"
          - entity: sensor.import_osszes_koltseg
            name: "Összes költség (HUF)"
          - entity: sensor.solis_s6_eh3p_today_energy_imported_from_grid_cost
            name: "Import költség"
          - entity: sensor.solis_s6_eh3p_today_energy_fed_into_grid_compensation
            name: "Export kompenzáció"
        grid_options:
          columns: 12

  # ── Top Consumers ──
  - type: grid
    cards:
      - type: entities
        title: "Top Fogyasztók"
        entities:
          - entity: sensor.iroda_aram_mero_energy
            name: "Iroda"
          - entity: sensor.bojler_aram_mero_energy
            name: "Bojler"
          - entity: sensor.mosogep_energy
            name: "Mosógép"
          - entity: sensor.medence_szivattyu_biztositek_energy
            name: "Medence szivattyú"
          - entity: sensor.klima_aram_mero_energy
            name: "Klíma"
          - entity: sensor.pince_melyhuto_energy
            name: "Mélyhűtő"
          - entity: sensor.konyha_huto_energy
            name: "Konyha hűtő"
          - entity: sensor.pince_nagy_huto_energy
            name: "Pince nagy hűtő"
          - entity: sensor.pince_huto_energy
            name: "Pince hűtő"
          - entity: sensor.szaritogep_energy
            name: "Szarítógép"
        grid_options:
          columns: 12

  # ── Top Consumers Instant ──
  - type: grid
    cards:
      - type: entities
        title: "Pillanatnyi Fogyasztók (W)"
        entities:
          - entity: sensor.klima_aram_mero_power
            name: "Klíma"
          - entity: sensor.iroda_aram_mero_power
            name: "Iroda"
          - entity: sensor.mosogep_power
            name: "Mosógép"
          - entity: sensor.bojler_aram_mero_power
            name: "Bojler"
          - entity: sensor.medence_szivattyu_biztositek_power
            name: "Medence szivattyú"
          - entity: sensor.pince_melyhuto_power
            name: "Mélyhűtő"
          - entity: sensor.szaritogep_power
            name: "Szarítógép"
          - entity: sensor.konyha_huto_power
            name: "Konyha hűtő"
          - entity: sensor.pince_huto_power
            name: "Pince hűtő"
          - entity: sensor.pince_nagy_huto_power
            name: "Pince nagy hűtő"
          - entity: sensor.tamfal_jelerosito_aram_mero_kapcsolo_power
            name: "Támfal jelző"
        grid_options:
          columns: 12
