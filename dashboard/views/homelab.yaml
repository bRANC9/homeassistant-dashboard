title: Homelab
path: homelab
icon: mdi:server-network
type: sections
theme: Helios
max_columns: 12
sections:
  # ── Homelab ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F5A5 Homelab"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "Home Assistant"
          - secondary: "{{ states('sensor.backup_backup_manager_state') }}"
          - icon: mdi:home-assistant
          - icon_color: "rgb(0, 188, 212)"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "Zigbee2MQTT"
          - secondary: "{{ states('sensor.zigbee2mqtt_bridge_version') }}"
          - icon: mdi:zigbee
          - icon_color: "{{ states('sensor.z2m_connection_color') }}"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "TrueNAS"
          - secondary: "{{ state_attr('update.truenas_ce_update', 'installed_version', 'v2.4.1') }}"
          - icon: mdi:nas
          - icon_color: "{{ 'orange' if is_state('update.truenas_ce_update', 'on') else 'green' }}"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "TrueNAS Apps"
          - secondary: "{{ states('sensor.truenas_apps_state') }} fut"
          - icon: mdi:docker
          - icon_color: "rgb(0, 188, 212)"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "TrueNAS Alerts"
          - secondary: "{{ states('sensor.truenas_alerts') }} figyelmeztetés"
          - icon: mdi:alert
          - icon_color: "{{ 'orange' if states('sensor.truenas_alerts')|int > 0 else 'green' }}"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "Uptime"
          - secondary: "{{ relative_time(states('sensor.truenas_uptime')) }}"
          - icon: mdi:clock-outline
          - icon_color: "green"
        grid_options:
          columns: 4

      - type: custom:mushroom-entity-card
        entity: switch.truenas_cron_jobs_update_cloudflare_enabled
        name: "Cloudflare DDNS"
        icon: mdi:cloud
        layout: vertical
        grid_options:
          columns: 4

      - type: custom:mushroom-template-card
        primary: "Cloudflare futtatás"
        icon: mdi:refresh
        icon_color: grey
        layout: vertical
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.truenas_cron_jobs_update_cloudflare_run
        grid_options:
          columns: 4

      - type: custom:mushroom-template-card
        primary: "Helios Dashboard"
        secondary: "Build __HELIOS_BUILD__"
        icon: mdi:source-commit
        icon_color: green
        layout: vertical
        grid_options:
          columns: 12

  # ── Zigbee2MQTT ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Zigbee2MQTT"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: binary_sensor.zigbee2mqtt_bridge_connection_state
          - name: Bridge State
          - icon: mdi:zigbee
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: button.zigbee2mqtt_bridge_restart
          - name: Restart
          - icon: mdi:restart
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: switch.zigbee2mqtt_bridge_permit_join
          - name: Permit Join
          - icon: mdi:plus-network
        grid_options:
          columns: 4

      - type: custom:mushroom-select-card
        entity: select.zigbee2mqtt_bridge_log_level
        name: Log Level
        icon: mdi:file-document
        grid_options:
          columns: 12

  # ── System Health ──
  - type: grid
    cards:
      - type: entities
        title: "Rendszer"
        entities:
          - entity: sensor.backup_backup_manager_state
            name: "Backup állapot"
          - entity: sensor.backup_next_scheduled_automatic_backup
            name: "Következő backup"
          - entity: update.truenas_ce_update
            name: "TrueNAS update"
          - entity: sensor.zigbee2mqtt_bridge_version
            name: "Z2M verzió"
          - entity: sensor.truenas_cpu_usage
            name: "TrueNAS CPU"
          - entity: sensor.truenas_memory_usage
            name: "TrueNAS RAM"
        grid_options:
          columns: 8

      - type: entities
        title: "Hálózat"
        entities:
          - entity: binary_sensor.truenas_network_enp2s0_link
            name: "TrueNAS link"
          - entity: sensor.truenas_network_enp2s0_rx
            name: "TrueNAS RX"
          - entity: sensor.truenas_network_enp2s0_tx
            name: "TrueNAS TX"
          - entity: binary_sensor.truenas_apps_pangolin
            name: "Pangolin reverse proxy"
          - entity: binary_sensor.truenas_apps_adguard_home
            name: "AdGuard Home DNS"
        grid_options:
          columns: 8

      # ── TrueNAS Docker Apps ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F4E6 TrueNAS Docker"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Home Assistant"
          - icon: mdi:home-assistant
          - app_name: "homeassistant"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Zigbee2MQTT"
          - icon: mdi:zigbee
          - app_name: "zigbee2mqtt"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Jellyfin"
          - icon: mdi:filmstrip-box
          - app_name: "jellyfin"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Frigate"
          - icon: mdi:cctv
          - app_name: "frigate"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Immich"
          - icon: mdi:image-multiple
          - app_name: "immich"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Pangolin"
          - icon: mdi:shield-home
          - app_name: "pangolin"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "AdGuard"
          - icon: mdi:shield-check
          - app_name: "adguard_home"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "ESPHome"
          - icon: mdi:chip
          - app_name: "esphome"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Transmission"
          - icon: mdi:download
          - app_name: "transmission"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Sonarr"
          - icon: mdi:television
          - app_name: "sonarr"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Radarr"
          - icon: mdi:movie
          - app_name: "radarr"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Netdata"
          - icon: mdi:chart-line
          - app_name: "netdata"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Mosquitto"
          - icon: mdi:message-text-outline
          - app_name: "mosquitto"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Seerr"
          - icon: mdi:movie-open
          - app_name: "seerr"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Jackett"
          - icon: mdi:magnify
          - app_name: "jackett"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Watchtower"
          - icon: mdi:update
          - app_name: "watchtower"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Cloudflare DDNS"
          - icon: mdi:cloud
          - app_name: "azure_agent"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: docker_tile
        variables:
          - primary: "Grafana"
          - icon: mdi:chart-line
          - app_name: "grafana"
        grid_options:
          columns: 3

  # ── Docker frissítések ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Docker frissítések"
        subtitle: "TrueNAS alkalmazások"
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "Frissíthető"
          - secondary: "{{ states('sensor.truenas_apps_with_updates') }} darab"
          - icon: mdi:docker
          - icon_color: >-
              {% set c = states('sensor.truenas_apps_with_updates')|int(0) %}
              {% if c > 0 %}orange{% else %}green{% endif %}
        grid_options:
          columns: 4

      - type: markdown
        content: |
          {% set apps = state_attr('sensor.truenas_apps_state', 'apps') %}
          {% set ns = namespace(updates=[]) %}
          {% if apps %}
          {% for aid, data in apps | dictsort if data.get('upgrade_available') %}
          {% set ns.updates = ns.updates + [data] %}
          {% endfor %}
          {% if ns.updates %}
          | Alkalmazás | Verzió | Új
          |---|---|---|
          {% for d in ns.updates %}
          | {{ d.get('name') or '?' }} | {{ d.get('human_version') or '?' }} | {{ d.get('latest_version') or '?' }}
          {% endfor %}
          {% else %}
          Nincs függő frissítés.
          {% endif %}
          {% endif %}
        grid_options:
          columns: 12
