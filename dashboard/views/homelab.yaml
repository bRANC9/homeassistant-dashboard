title: Homelab
path: homelab
icon: mdi:server-network
type: sections
theme: Helios
max_columns: 12
sections:
  # ── Home Assistant ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F5A5 Homelab"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "Home Assistant"
          - secondary: "{{ states('sensor.backup_backup_manager_state') }}"
          - icon: mdi:home-assistant
          - icon_color: "rgb(0, 188, 212)"
        grid_options:
          columns: 6

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "Zigbee2MQTT"
          - secondary: "{{ states('sensor.zigbee2mqtt_bridge_version') }}"
          - icon: mdi:zigbee
          - icon_color: "{{ states('sensor.z2m_connection_color') }}"
        grid_options:
          columns: 6

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "TrueNAS"
          - secondary: "{{ states('sensor.truenas_update_text') }}"
          - icon: mdi:nas
          - icon_color: "{{ states('sensor.truenas_update_color') }}"
        grid_options:
          columns: 6

      - !include ../cards/deployment_version.yaml

  # ── Zigbee2MQTT ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Zigbee2MQTT"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: binary_sensor.zigbee2mqtt_bridge_connection_state
          - name: Bridge State
          - icon: mdi:zigbee
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: button.zigbee2mqtt_bridge_restart
          - name: Restart
          - icon: mdi:restart
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: switch.zigbee2mqtt_bridge_permit_join
          - name: Permit Join
          - icon: mdi:plus-network
        grid_options:
          columns: 4

      - type: custom:mushroom-select-card
        entity: select.zigbee2mqtt_bridge_log_level
        name: Log Level
        icon: mdi:file-document
        grid_options:
          columns: 12

  # ── System Health ──
  - type: grid
    cards:
      - type: entities
        title: "Rendszer"
        entities:
          - entity: sensor.backup_backup_manager_state
            name: "Backup állapot"
          - entity: sensor.backup_next_scheduled_automatic_backup
            name: "Következő backup"
          - entity: update.truenas_ce_update
            name: "TrueNAS update"
          - entity: sensor.zigbee2mqtt_bridge_version
            name: "Z2M verzió"
        grid_options:
          columns: 8

      - type: entities
        title: "Hálózat"
        entities:
          - entity: binary_sensor.truenas_network_enp2s0_link
            name: "TrueNAS link"
          - entity: sensor.truenas_network_enp2s0_rx
            name: "TrueNAS RX"
          - entity: sensor.truenas_network_enp2s0_tx
            name: "TrueNAS TX"
          - entity: binary_sensor.truenas_apps_pangolin
            name: "Pangolin reverse proxy"
          - entity: binary_sensor.truenas_apps_adguard_home
            name: "AdGuard Home DNS"
          - entity: switch.truenas_cron_jobs_update_cloudflare_enabled
            name: "Cloudflare DDNS"
        grid_options:
          columns: 4

      # ── TrueNAS Docker Apps ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F4E6 TrueNAS Docker"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Home Assistant"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_homeassistant', 'on') else 'Stopped' }}"
          - icon: mdi:home-assistant
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_homeassistant', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Zigbee2MQTT"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_zigbee2mqtt', 'on') else 'Stopped' }}"
          - icon: mdi:zigbee
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_zigbee2mqtt', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Jellyfin"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_jellyfin', 'on') else 'Stopped' }}"
          - icon: mdi:filmstrip-box
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_jellyfin', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Frigate"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_frigate', 'on') else 'Stopped' }}"
          - icon: mdi:cctv
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_frigate', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Immich"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_immich', 'on') else 'Stopped' }}"
          - icon: mdi:image-multiple
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_immich', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Pangolin"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_pangolin', 'on') else 'Stopped' }}"
          - icon: mdi:shield-home
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_pangolin', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "AdGuard"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_adguard_home', 'on') else 'Stopped' }}"
          - icon: mdi:shield-check
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_adguard_home', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "ESPHome"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_esphome', 'on') else 'Stopped' }}"
          - icon: mdi:chip
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_esphome', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Transmission"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_transmission', 'on') else 'Stopped' }}"
          - icon: mdi:download
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_transmission', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Sonarr"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_sonarr', 'on') else 'Stopped' }}"
          - icon: mdi:television
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_sonarr', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Radarr"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_radarr', 'on') else 'Stopped' }}"
          - icon: mdi:movie
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_radarr', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Netdata"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_netdata', 'on') else 'Stopped' }}"
          - icon: mdi:chart-line
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_netdata', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Mosquitto"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_mosquitto', 'on') else 'Stopped' }}"
          - icon: mdi:broker
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_mosquitto', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Seerr"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_seerr', 'on') else 'Stopped' }}"
          - icon: mdi:movie-open
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_seerr', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Jackett"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_jackett', 'on') else 'Stopped' }}"
          - icon: mdi:magnify
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_jackett', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Watchtower"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_watchtower', 'on') else 'Stopped' }}"
          - icon: mdi:update
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_watchtower', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Cloudflare DDNS"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_azure_agent', 'on') else 'Stopped' }}"
          - icon: mdi:cloud
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_azure_agent', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "Grafana"
          - secondary: "{{ 'Running' if is_state('binary_sensor.truenas_apps_grafana', 'on') else 'Stopped' }}"
          - icon: mdi:chart-line
          - icon_color: "{{ 'green' if is_state('binary_sensor.truenas_apps_grafana', 'on') else 'red' }}"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "TrueNAS"
          - secondary: "{{ 'CPU ' ~ states('sensor.truenas_cpu_usage') ~ '%' }}"
          - icon: mdi:nas
          - icon_color: "rgb(0, 188, 212)"
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: service_tile
        variables:
          - primary: "TrueNAS RAM"
          - secondary: "{{ states('sensor.truenas_memory_usage') }}%"
          - icon: mdi:memory
          - icon_color: "rgb(156, 39, 176)"
        grid_options:
          columns: 3

  # ── Devices ──
  - type: grid
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: "Eszközök"
        filter:
          - include:
              domain: update
          - include:
              domain: sensor
              attributes:
                device_class: timestamp
        sort:
          method: name
        grid_options:
          columns: 12
