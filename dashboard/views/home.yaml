title: Home
path: home
icon: mdi:home
type: sections
theme: Helios
max_columns: 12
sections:
  # ── Status Chips ──
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_total_pv_power') }}W"
          - secondary: Solar
          - icon: mdi:solar-power
          - icon_color: "rgb(244, 196, 48)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_household_load_power') }}W"
          - secondary: House
          - icon: mdi:home-lightning-bolt
          - icon_color: "rgb(100, 180, 246)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_battery_soc') }}%"
          - secondary: Battery
          - icon: mdi:battery
          - icon_color: "{{ states('sensor.battery_soc_color_rgb') }}"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.ioniq_5_ev_battery_level') }}%"
          - secondary: EV
          - icon: mdi:car-electric
          - icon_color: "{{ states('sensor.ev_battery_color_rgb') }}"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.medence_cso_homero_probe_temperature') }}°C"
          - secondary: Pool
          - icon: mdi:thermometer-water
          - icon_color: "rgb(255, 152, 0)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.terasz_homero_temperature') }}°C"
          - secondary: "{{ states('sensor.terasz_homero_humidity') }}%"
          - icon: mdi:thermometer
          - icon_color: "rgb(0, 188, 212)"
        grid_options:
          columns: 2

  # ── Power Flow ──
  - type: grid
    cards:
      - type: custom:sunsynk-power-flow-card
        card_height: "580px"
        card_width: "100%"
        decimal_places: 2
        decimal_places_energy: 1
        dynamic_line_width: true
        max_line_width: 8
        min_line_width: 1
        panel_mode: true
        inverter:
          model: solis
          modern: true
          colour: "#959595"
          autarky: power
          three_phase: true
          auto_scale: true
        battery:
          shutdown_soc: 20
          show_daily: true
          colour: "#ffc0cb"
          animation_speed: 6
          max_power: 7100
          auto_scale: true
          show_absolute: false
          animate: true
          show_remaining_energy: true
          invert_power: false
          dynamic_colour: true
          linear_gradient: true
          invert_flow: false
          remaining_energy_to_shutdown: false
          hide_soc: false
          count: 1
          energy: 7100
        solar:
          mppts: 2
          show_daily: true
          colour: "#f4c430"
          animation_speed: 9
          max_power: 9600
          pv2_name: Nyugat
          dynamic_colour: true
          pv1_name: Dél
          pv1_max_power: 2975
          pv2_max_power: 4250
        load:
          show_aux: false
          show_daily: true
          animation_speed: 8
          max_power: 6000
          auto_scale: true
          dynamic_colour: false
          dynamic_icon: true
          load1_name: Ioniq 5
          additional_loads: 3
          load1_icon: mdi:battery-charging
          load2_name: Klíma
          load2_icon: mdi:air-conditioner
          load1_max_threshold: 2200
          load3_max_threshold: 2000
          load3_icon: mdi:water-boiler
          load3_name: Bojler
        grid:
          show_daily_buy: true
          no_grid_colour: "#ff0000"
          animation_speed: 8
          max_power: 6000
          invert_grid: true
          auto_scale: true
          show_daily_sell: true
        entities:
          dc_transformer_temp_90: sensor.solis_s6_eh3p_lead_acid_battery_temperature
          day_battery_charge_70: sensor.solis_s6_eh3p_today_battery_charge_energy
          day_battery_discharge_71: sensor.solis_s6_eh3p_today_battery_discharge_energy
          day_load_energy_84: sensor.solis_s6_eh3p_today_energy_consumption
          day_grid_import_76: sensor.solis_s6_eh3p_today_energy_imported_from_grid
          day_pv_energy_108: sensor.solis_s6_eh3p_pv_today_energy_generation
          inverter_voltage_154: sensor.solis_s6_eh3p_a_phase_voltage
          load_frequency_192: sensor.solis_s6_eh3p_grid_frequency
          inverter_current_164: sensor.solis_s6_eh3p_a_phase_current
          grid_power_169: sensor.solis_s6_eh3p_meter_total_active_power
          battery_voltage_183: sensor.solis_s6_eh3p_battery_voltage
          battery_current_191: sensor.solis_s6_eh3p_battery_current
          essential_power: sensor.solis_s6_eh3p_household_load_power
          grid_ct_power_172: sensor.solis_s6_eh3p_meter_total_active_power
          pv1_voltage_109: sensor.solis_s6_eh3p_pv_voltage_1
          pv1_current_110: sensor.solis_s6_eh3p_pv_current_1
          pv1_power_186: sensor.solis_s6_eh3p_pv_power_1
          pv2_power_187: sensor.solis_s6_eh3p_pv_power_2
          pv_total: sensor.solis_s6_eh3p_total_pv_power
          pv2_voltage_111: sensor.solis_s6_eh3p_pv_voltage_2
          pv2_current_112: sensor.solis_s6_eh3p_pv_current_2
          grid_voltage: sensor.solis_s6_eh3p_a_phase_voltage
          battery_current_direction: sensor.solis_s6_eh3p_battery_current_direction
          inverter_status_59: sensor.solis_s6_eh3p_current_status
          environment_temp: sensor.solis_s6_eh3p_temperature
          remaining_solar: sensor.sun_next_dusk
          battery_power_190: sensor.solis_s6_eh3p_battery_power
          inverter_voltage_L2: sensor.solis_s6_eh3p_b_phase_voltage
          inverter_voltage_L3: sensor.solis_s6_eh3p_c_phase_voltage
          inverter_current_L2: sensor.solis_s6_eh3p_b_phase_current
          inverter_current_L3: sensor.solis_s6_eh3p_c_phase_current
          inverter_power_175: sensor.solis_s6_eh3p_active_power
          battery_soc_184: sensor.solis_s6_eh3p_battery_soc
          day_grid_export_77: sensor.solis_s6_eh3p_today_energy_fed_into_grid
          total_pv_generation: sensor.solis_s6_eh3p_pv_total_energy_generation
          essential_load1: sensor.22k07_charging_station_charging_power
          essential_load2: sensor.klima_aram_mero_power
          essential_load3: sensor.bojler_aram_mero_power
        grid_options:
          columns: 12
          rows: 5

  # ── EV Smart Charging ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F68A EV Smart Charging"
        subtitle: "{{ states('sensor.ev_charger_status_text') }}"
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: switch.22k07_charging_station_start_stop
          - name: Charger
          - icon: mdi:ev-station
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.ioniq_5_ev_battery_level') }}%"
          - secondary: "{{ states('sensor.ioniq_5_ev_range') }} km"
          - icon: mdi:car-electric
          - icon_color: "{{ states('sensor.ev_battery_color_name') }}"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_battery_soc') }}%"
          - secondary: Dyness
          - icon: mdi:battery
          - icon_color: "{{ states('sensor.battery_soc_color_name') }}"
        grid_options:
          columns: 4

      - type: custom:mushroom-select-card
        entity: input_select.ev_charge_mode
        name: Mode
        icon: mdi:car-electric
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.ev_usable_surplus') }} kW"
          - secondary: Surplus
          - icon: mdi:solar-power
          - icon_color: "{{ states('sensor.ev_surplus_color') }}"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.ev_target_soc_effective') }}%"
          - secondary: Target
          - icon: mdi:flag-checkered
          - icon_color: purple
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('number.22k07_charging_station_charge_current') }}A"
          - secondary: Amps
          - icon: mdi:current-ac
          - icon_color: grey
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.22k07_charging_station_total_energy') }} kWh"
          - secondary: Total
          - icon: mdi:counter
          - icon_color: grey
        grid_options:
          columns: 4

      - type: custom:mushroom-number-card
        entity: number.22k07_charging_station_charge_current
        name: Amps
        icon: mdi:current-ac
        display_mode: slider
        grid_options:
          columns: 4

  # ── Pool & Weather ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F3CA Pool"
        subtitle: "{{ states('sensor.pool_pump_status_text') }}"
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: switch.medence_szivattyu_biztositek
          - name: Szivattyú
          - icon: mdi:water-pump
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.medence_cso_homero_probe_temperature') }}°C"
          - secondary: Water
          - icon: mdi:thermometer-water
          - icon_color: grey
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('input_number.medence_utolso_homerseklet') }}°C"
          - secondary: Cached
          - icon: mdi:thermometer-check
          - icon_color: cyan
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('input_number.pool_pump_daily_total_runtime') }}h/8h"
          - secondary: Runtime
          - icon: mdi:timer
          - icon_color: blue
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          - entity: switch.medence_vilagitas_biztositek
          - name: Fény
          - icon: mdi:swim
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('input_datetime.pool_pump_stop_time')[11:16] }}"
          - secondary: Stop
          - icon: mdi:clock-outline
          - icon_color: red
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: action_chip
        variables:
          - primary: "+1h"
          - secondary: Extend
          - icon: mdi:clock-plus
          - icon_color: blue
          - perform_action: input_button.press
          - target_entity: input_button.pool_pump_extend_time
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: action_chip
        variables:
          - primary: "-1h"
          - secondary: Reduce
          - icon: mdi:clock-minus
          - icon_color: orange
          - perform_action: input_button.press
          - target_entity: input_button.pool_pump_reduce_time
        grid_options:
          columns: 3

      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: false
        grid_options:
          columns: 6

      - type: custom:mini-graph-card
        name: Terasz
        hours_to_show: 24
        points_per_hour: 2
        animate: true
        line_width: 4
        show:
          labels: true
          legend: true
        entities:
          - entity: sensor.terasz_homero_temperature
            name: Hőmérséklet
            color: "#00bcd4"
          - entity: sensor.terasz_homero_humidity
            name: Páratartalom
            y_axis: secondary
            color: "#2196f3"
        grid_options:
          columns: 6

  # ── Climate & Rooms ──
  - type: grid
    cards:
      - type: custom:mushroom-entity-card
        entity: climate.nappali_klima
        name: "Nappali klíma"
        icon: mdi:air-conditioner
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: "Nappali Klíma"
              size: wide
              content:
                type: custom:bubble-card
                card_type: button
                entity: climate.nappali_klima
                button_type: state
                name: "Nappali Klíma"
                icon: mdi:air-conditioner
        grid_options:
          columns: 3

      - type: custom:mushroom-entity-card
        entity: climate.master_bedroom
        name: "Háló klíma"
        icon: mdi:air-conditioner
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: "Háló Klíma"
              size: wide
              content:
                type: custom:bubble-card
                card_type: button
                entity: climate.master_bedroom
                button_type: state
                name: "Háló Klíma"
                icon: mdi:air-conditioner
        grid_options:
          columns: 3

      - type: custom:mushroom-entity-card
        entity: climate.nappali_padlofutes
        name: "Nappali fűtés"
        icon: mdi:heating-coil
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: "Nappali Padlófűtés"
              size: wide
              content:
                type: custom:bubble-card
                card_type: button
                entity: climate.nappali_padlofutes
                button_type: state
                name: "Nappali Fűtés"
                icon: mdi:heating-coil
        grid_options:
          columns: 3

      - type: custom:mushroom-entity-card
        entity: climate.szoba_padlo_futes
        name: "Szoba fűtés"
        icon: mdi:heating-coil
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: "Szoba Padlófűtés"
              size: wide
              content:
                type: custom:bubble-card
                card_type: button
                entity: climate.szoba_padlo_futes
                button_type: state
                name: "Szoba Fűtés"
                icon: mdi:heating-coil
        grid_options:
          columns: 3

      - type: custom:mushroom-title-card
        title: "Hőmérsékletek"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.nappali_homero_temperature') }}°C"
          - secondary: Nappali
          - icon: mdi:thermometer
          - icon_color: "rgb(255, 152, 0)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.halo_homero_temperature') }}°C"
          - secondary: Háló
          - icon: mdi:thermometer
          - icon_color: "rgb(156, 39, 176)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.gyerek_szoba_homero_temperature') }}°C"
          - secondary: Gyerekszoba
          - icon: mdi:thermometer
          - icon_color: "rgb(33, 150, 243)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.furdo_homero_temperature') }}°C"
          - secondary: Fürdő
          - icon: mdi:thermometer-water
          - icon_color: "rgb(0, 188, 212)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.pince_homero_temperature') }}°C"
          - secondary: Pince
          - icon: mdi:thermometer
          - icon_color: "rgb(121, 85, 72)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.garazs_homero_temperature') }}°C"
          - secondary: Garázs
          - icon: mdi:thermometer
          - icon_color: "rgb(96, 125, 139)"
        grid_options:
          columns: 2

  # ── Lights & Alerts ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Fények"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:mushroom-entity-card
        entity: light.konyha_csap_vilagitas
        name: "Összes fény"
        icon: mdi:lightbulb-group
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: "Fények"
              size: wide
              content:
                type: vertical-stack
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: custom:mushroom-light-card
                        entity: light.konyha_csap_vilagitas
                        name: Konyha csap
                        icon: mdi:ceiling-light
                      - type: custom:mushroom-light-card
                        entity: light.wled
                        name: WLED
                        icon: mdi:led-strip-variant
                      - type: custom:mushroom-light-card
                        entity: light.athidalo
                        name: Áthidaló
                        icon: mdi:floor-lamp
                  - type: horizontal-stack
                    cards:
                      - type: custom:mushroom-entity-card
                        entity: switch.pince_terasz_hangulat_vilagitas
                        name: Terasz
                        icon: mdi:outdoor-lamp
                        tap_action:
                          action: toggle
                        layout: vertical
                      - type: custom:mushroom-light-card
                        entity: light.konyha_mennyezet
                        name: Konyha mennyezet
                        icon: mdi:ceiling-light-multiple
                      - type: custom:mushroom-light-card
                        entity: light.nappali_lampa
                        name: Nappali
                        icon: mdi:floor-lamp
        grid_options:
          columns: 12

      - type: custom:auto-entities
        card:
          type: entities
          title: "Riasztások"
        filter:
          - include:
              - domain: binary_sensor
                state: "on"
                attributes:
                  device_class: problem
          - include:
              - state: "unavailable"
        sort:
          method: state
        grid_options:
          columns: 12

  # ── Energy Daily Summary ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Napi Energia Összesítés"
        subtitle: >-
          ☀ {{ states('sensor.solis_s6_eh3p_pv_today_energy_generation') }} kWh | 
          🏠 {{ states('sensor.solis_s6_eh3p_today_energy_consumption') }} kWh
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_pv_today_energy_generation') }} kWh"
          - secondary: "☀ Solar"
          - icon: mdi:solar-power
          - icon_color: "rgb(244, 196, 48)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_today_energy_consumption') }} kWh"
          - secondary: "🏠 Load"
          - icon: mdi:home-lightning-bolt
          - icon_color: "rgb(100, 180, 246)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: "{{ states('sensor.solis_s6_eh3p_battery_soc') }}%"
          - secondary: "🔋 Battery"
          - icon: mdi:battery
          - icon_color: "{{ states('sensor.battery_soc_color_rgb') }}"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: >-
              {{ states('sensor.solis_s6_eh3p_today_energy_imported_from_grid') }} kWh
          - secondary: "⚡ Import"
          - icon: mdi:transmission-tower-import
          - icon_color: "rgb(255, 152, 0)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: >-
              {{ states('sensor.solis_s6_eh3p_today_energy_fed_into_grid') }} kWh
          - secondary: "⚡ Export"
          - icon: mdi:transmission-tower-export
          - icon_color: "rgb(76, 175, 80)"
        grid_options:
          columns: 2

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          - primary: >-
              {{ states('sensor.solis_s6_eh3p_today_energy_fed_into_grid_compensation') }} HUF
          - secondary: "💰 Saved"
          - icon: mdi:cash
          - icon_color: "rgb(0, 200, 83)"
        grid_options:
          columns: 2

  # ── Temperature History ──
  - type: grid
    cards:
      - type: custom:mini-graph-card
        name: "Hőmérsékletek (24h)"
        hours_to_show: 24
        points_per_hour: 2
        animate: true
        line_width: 3
        show:
          labels: true
          legend: true
          extrema: true
        entities:
          - entity: sensor.nappali_homero_temperature
            name: Nappali
            color: "#ff9800"
          - entity: sensor.gyerek_szoba_homero_temperature
            name: Gyerekszoba
            color: "#2196f3"
          - entity: sensor.halo_homero_temperature
            name: Háló
            color: "#9c27b0"
          - entity: sensor.furdo_homero_temperature
            name: Fürdő
            color: "#00bcd4"
          - entity: sensor.pince_homero_temperature
            name: Pince
            color: "#795548"
        grid_options:
          columns: 6

      - type: custom:mini-graph-card
        name: "Páratartalom (24h)"
        hours_to_show: 24
        points_per_hour: 2
        animate: true
        line_width: 3
        show:
          labels: true
          legend: true
          extrema: true
        entities:
          - entity: sensor.nappali_homero_humidity
            name: Nappali
            color: "#ff9800"
          - entity: sensor.gyerek_szoba_homero_humidity
            name: Gyerekszoba
            color: "#2196f3"
          - entity: sensor.halo_homero_humidity
            name: Háló
            color: "#9c27b0"
          - entity: sensor.furdo_homero_humidity
            name: Fürdő
            color: "#00bcd4"
          - entity: sensor.pince_homero_humidity
            name: Pince
            color: "#795548"
        grid_options:
          columns: 6
