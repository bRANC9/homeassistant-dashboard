title: Basement
path: basement
icon: mdi:home-floor-b
type: sections
max_columns: 4
sections:
  # ── Quick Controls ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Pince"
        subtitle: ""
        grid_options:
          columns: 12

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:mushroom-entity-card
            entity: button.wake_on_lan_b4_2e_99_d1_c0_37
            name: WoL Desktop
            icon: mdi:power
            tap_action:
              action: toggle
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-entity-card
            entity: button.desktop_nia5fgv_hibernate
            name: Altatás
            icon: mdi:power-sleep
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-entity-card
            entity: switch.pince_terasz_hangulat_vilagitas
            name: Terasz fény
            icon: mdi:outdoor-lamp
            tap_action:
              action: toggle
            layout: vertical
            grid_options:
              columns: 4

  # ── Sensors ──
  - type: grid
    cards:
      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.pince_homero_temperature') }}°C"
            secondary: "Pince"
            icon: mdi:thermometer
            icon_color: "rgb(121, 85, 72)"
            layout: vertical
            grid_options:
              columns: 3

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.pince_homero_humidity') }}%"
            secondary: "Pára"
            icon: mdi:water-percent
            icon_color: blue
            layout: vertical
            grid_options:
              columns: 3

          - type: custom:mushroom-entity-card
            entity: binary_sensor.pince_mozgas_erzekelo_presence
            name: Mozgás
            icon: mdi:motion-sensor
            layout: vertical
            grid_options:
              columns: 3

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.iroda_aram_mero_power') }} W"
            secondary: "Iroda"
            icon: mdi:monitor-shimmer
            icon_color: cyan
            layout: vertical
            grid_options:
              columns: 3

  # ── Battery & Grid Detail ──
  - type: grid
    cards:
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.solis_s6_eh3p_battery_voltage
            name: Voltage
            y_axis: secondary
          - entity: sensor.solis_s6_eh3p_battery_soc
            name: SOC
          - entity: sensor.garazs_homero_temperature
            name: Hőmérséklet
        name: "Battery & Garage (24h)"
        hours_to_show: 24
        points_per_hour: 60
        grid_options:
          columns: 12

  # ── Power Monitoring ──
  - type: grid
    cards:
      - type: history-graph
        entities:
          - entity: sensor.bojler_aram_mero_power
          - entity: sensor.pince_huto_power
          - entity: sensor.pince_melyhuto_power
          - entity: sensor.iroda_aram_mero_power
          - entity: sensor.klima_aram_mero_power
          - entity: sensor.konyha_huto_power
          - entity: sensor.mosogep_power
          - entity: sensor.szaritogep_power
          - entity: sensor.pince_nagy_huto_power
          - entity: sensor.2_es_medence_biztositek_power
          - entity: sensor.medence_szivattyu_biztositek_power
        title: "Áramok (24h)"
        hours_to_show: 24
        grid_options:
          columns: 12

  # ── Load Overview ──
  - type: grid
    cards:
      - type: history-graph
        entities:
          - entity: sensor.solis_s6_eh3p_household_load_power
          - entity: sensor.mert_fogyasztasok
          - entity: sensor.nem_mert_fogyasztasok
        title: "Fogyasztások (24h)"
        hours_to_show: 24
        grid_options:
          columns: 12

  # ── Entities List ──
  - type: grid
    cards:
      - type: entities
        title: "Pince szenzorok"
        entities:
          - entity: binary_sensor.pince_mozgas_erzekelo_presence
            name: "Mozgásérzékelő"
          - entity: sensor.pince_homero_temperature
            name: "Hőmérséklet"
          - entity: sensor.pince_homero_humidity
            name: "Páratartalom"
          - entity: sensor.iroda_aram_mero_power
            name: "Iroda fogyasztás"
          - entity: sensor.nem_mert_fogyasztasok
            name: "Nem mért fogyasztások"
          - entity: sensor.garazs_homero_temperature
            name: "Garázs hőmérséklet"
        grid_options:
          columns: 6

      - type: entities
        title: "Háztartási gépek"
        entities:
          - entity: sensor.washing_machine_state
            name: "Mosógép"
          - entity: sensor.bathroom_washing_machine_energy_total
            name: "Mosógép energia"
          - entity: sensor.szaritogep_state
            name: "Szárítógép"
          - entity: sensor.bathroom_szaritogep_energy_total
            name: "Szárítógép energia"
        grid_options:
          columns: 6
