title: Basement
path: basement
icon: mdi:home-floor-b
type: sections
theme: Helios
max_columns: 4
sections:
  # ── Quick Controls ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "Pince"
        subtitle: ""
        grid_options:
          columns: 12

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:decluttering-card
            template: entity_chip
            variables:
              entity: button.wake_on_lan_b4_2e_99_d1_c0_37
              name: WoL Desktop
              icon: mdi:power
              columns: 4

          - type: custom:decluttering-card
            template: entity_chip
            variables:
              entity: button.desktop_nia5fgv_hibernate
              name: Altatás
              icon: mdi:power-sleep
              columns: 4

          - type: custom:decluttering-card
            template: entity_chip
            variables:
              entity: switch.pince_terasz_hangulat_vilagitas
              name: Terasz fény
              icon: mdi:outdoor-lamp
              columns: 4

  # ── Sensors ──
  - type: grid
    cards:
      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:decluttering-card
            template: sensor_chip
            variables:
              primary: "{{ states('sensor.pince_homero_temperature') }}°C"
              secondary: "Pince"
              icon: mdi:thermometer
              icon_color: "rgb(121, 85, 72)"
              columns: 4

          - type: custom:decluttering-card
            template: sensor_chip
            variables:
              primary: "{{ states('sensor.pince_homero_humidity') }}%"
              secondary: "Pára"
              icon: mdi:water-percent
              icon_color: blue
              columns: 4

          - type: custom:decluttering-card
            template: entity_chip
            variables:
              entity: binary_sensor.pince_mozgas_erzekelo_presence
              name: Mozgás
              icon: mdi:motion-sensor
              columns: 4

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:decluttering-card
            template: sensor_chip
            variables:
              primary: "{{ states('sensor.iroda_aram_mero_power') }} W"
              secondary: "Iroda"
              icon: mdi:monitor-shimmer
              icon_color: cyan
              columns: 4

          - type: custom:decluttering-card
            template: sensor_chip
            variables:
              primary: "{{ states('sensor.garazs_homero_temperature') }}°C"
              secondary: "Garázs"
              icon: mdi:garage-variant
              icon_color: orange
              columns: 4

          - type: custom:decluttering-card
            template: sensor_chip
            variables:
              primary: "{{ states('sensor.nem_mert_fogyasztasok') }} W"
              secondary: "Nem mért"
              icon: mdi:help-circle
              icon_color: grey
              columns: 4

  # ── Battery & Garage (24h) ──
  - type: grid
    cards:
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.solis_s6_eh3p_battery_voltage
            name: Voltage
            y_axis: secondary
            color: "#ff9800"
          - entity: sensor.solis_s6_eh3p_battery_soc
            name: SOC
            color: "#4caf50"
          - entity: sensor.garazs_homero_temperature
            name: Hőmérséklet
            color: "#ff5722"
        name: "Battery & Garage (24h)"
        hours_to_show: 24
        line_width: 3
        animate: true
        show:
          labels: true
          legend: true
        grid_options:
          columns: 12

  # ── Áramok (24h) ──
  - type: grid
    cards:
      - type: custom:mini-graph-card
        name: "Áramok (24h)"
        hours_to_show: 24
        points_per_hour: 2
        animate: true
        line_width: 3
        show:
          labels: true
          legend: true
          extrema: true
        entities:
          - entity: sensor.bojler_aram_mero_power
            name: Bojler
            color: "#ff9800"
          - entity: sensor.pince_huto_power
            name: Pince hűtő
            color: "#795548"
          - entity: sensor.pince_melyhuto_power
            name: Mélyhűtő
            color: "#9c27b0"
          - entity: sensor.iroda_aram_mero_power
            name: Iroda
            color: "#4caf50"
          - entity: sensor.klima_aram_mero_power
            name: Klíma
            color: "#2196f3"
          - entity: sensor.konyha_huto_power
            name: Konyha hűtő
            color: "#00bcd4"
          - entity: sensor.mosogep_power
            name: Mosógép
            color: "#f44336"
          - entity: sensor.szaritogep_power
            name: Szárítógép
            color: "#ff5722"
          - entity: sensor.pince_nagy_huto_power
            name: Nagy hűtő
            color: "#607d8b"
          - entity: sensor.medence_szivattyu_biztositek_power
            name: Medence szivattyú
            color: "#03a9f4"
        grid_options:
          columns: 12

  # ── Fogyasztások (24h) ──
  - type: grid
    cards:
      - type: custom:mini-graph-card
        name: "Fogyasztások (24h)"
        hours_to_show: 24
        points_per_hour: 2
        animate: true
        line_width: 3
        show:
          labels: true
          legend: true
        entities:
          - entity: sensor.solis_s6_eh3p_household_load_power
            name: Essential
            color: "#ff5722"
          - entity: sensor.mert_fogyasztasok
            name: Mért
            color: "#ff9800"
          - entity: sensor.nem_mert_fogyasztasok
            name: Nem mért
            color: "#795548"
        grid_options:
          columns: 12

  # ── Részletes fogyasztás ──
  - type: grid
    cards:
      - type: entities
        title: "Pince szenzorok"
        entities:
          - entity: binary_sensor.pince_mozgas_erzekelo_presence
            name: "Mozgásérzékelő"
          - entity: sensor.pince_homero_temperature
            name: "Hőmérséklet"
          - entity: sensor.pince_homero_humidity
            name: "Páratartalom"
          - entity: sensor.iroda_aram_mero_power
            name: "Iroda fogyasztás"
          - entity: sensor.nem_mert_fogyasztasok
            name: "Nem mért fogyasztások"
          - entity: sensor.garazs_homero_temperature
            name: "Garázs hőmérséklet"
        grid_options:
          columns: 6

      - type: entities
        title: "Háztartási gépek"
        entities:
          - entity: sensor.washing_machine_state
            name: "Mosógép"
          - entity: sensor.bathroom_washing_machine_energy_total
            name: "Mosógép energia"
          - entity: sensor.szaritogep_state
            name: "Szárítógép"
          - entity: sensor.bathroom_szaritogep_energy_total
            name: "Szárítógép energia"
        grid_options:
          columns: 6
