title: EV
path: ev
icon: mdi:car-electric
type: sections
theme: Helios
max_columns: 4
sections:
  # ── Vehicle Status ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F697 IONIQ 5"
        subtitle: >-
          Last update: {{ states('sensor.ioniq_5_last_updated_at') }}
        grid_options:
          columns: 12

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ioniq_5_ev_battery_level') }}%"
            secondary: "{{ states('sensor.ioniq_5_ev_range') }} km"
            icon: mdi:car-electric
            icon_color: "{{ states('sensor.ev_battery_color_name') }}"
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ioniq_5_odometer') }} km"
            secondary: "Odometer"
            icon: mdi:counter
            icon_color: grey
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ioniq_5_average_energy_consumption') }} Wh/km"
            secondary: "Avg Consumption"
            icon: mdi:chart-line
            icon_color: cyan
            layout: vertical
            grid_options:
              columns: 4

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.ioniq_5_ev_battery_charge
            name: Charging
            icon: mdi:battery-charging
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-entity-card
            entity: binary_sensor.ioniq_5_ev_battery_plug
            name: Plugged In
            icon: mdi:power-plug
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-entity-card
            entity: binary_sensor.ioniq_5_locked
            name: Locked
            icon: mdi:car-door-lock
            layout: vertical
            grid_options:
              columns: 4

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:mushroom-entity-card
            entity: lock.ioniq_5_door_lock
            name: Door Lock
            icon: mdi:lock
            tap_action:
              action: toggle
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-entity-card
            entity: switch.ioniq_5_ioniq_5_climate
            name: Climate
            icon: mdi:hvac
            tap_action:
              action: toggle
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-entity-card
            entity: switch.ioniq_5_ioniq_5_ev_charging
            name: EV Charging
            icon: mdi:ev-station
            tap_action:
              action: toggle
            layout: vertical
            grid_options:
              columns: 4

  # ── Charging Station ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\u26A1 Charging Station"
        subtitle: "{{ states('sensor.ev_charger_status_text') }}"
        grid_options:
          columns: 12

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.22k07_charging_station_start_stop
            name: Start/Stop
            icon: mdi:ev-station
            tap_action:
              action: toggle
            layout: vertical
            grid_options:
              columns: 3

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.22k07_charging_station_charging_power') }} W"
            secondary: "Power"
            icon: mdi:flash
            icon_color: yellow
            layout: vertical
            grid_options:
              columns: 3

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.22k07_charging_station_total_energy') }} kWh"
            secondary: "Total"
            icon: mdi:counter
            icon_color: blue
            layout: vertical
            grid_options:
              columns: 3

          - type: custom:mushroom-template-card
            primary: "{{ states('number.22k07_charging_station_charge_current') }}A"
            secondary: "Current"
            icon: mdi:current-ac
            icon_color: orange
            layout: vertical
            grid_options:
              columns: 3

      - type: custom:mushroom-number-card
        entity: number.22k07_charging_station_charge_current
        name: Charge Current (A)
        icon: mdi:current-ac
        display_mode: slider
        grid_options:
          columns: 12

  # ── Smart Charging ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\u2699\uFE0F Smart Charging"
        subtitle: ""
        grid_options:
          columns: 12

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:mushroom-select-card
            entity: input_select.ev_charge_mode
            name: Mode
            icon: mdi:car-electric
            grid_options:
              columns: 4

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ev_usable_surplus') }} kW"
            secondary: "Surplus"
            icon: mdi:solar-power
            icon_color: "{{ states('sensor.ev_surplus_color') }}"
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ev_target_soc_effective') }}%"
            secondary: "Target SOC"
            icon: mdi:flag-checkered
            icon_color: purple
            layout: vertical
            grid_options:
              columns: 4

      - type: horizontal-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:mushroom-entity-card
            entity: input_boolean.ev_force_charge_today
            name: Force Charge
            icon: mdi:ev-station
            tap_action:
              action: toggle
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ev_power_kw') }} kW"
            secondary: "EV Power"
            icon: mdi:flash
            icon_color: yellow
            layout: vertical
            grid_options:
              columns: 4

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ev_charge_hours_remaining') }}h"
            secondary: "Time to Full"
            icon: mdi:timer-sand
            icon_color: cyan
            layout: vertical
            grid_options:
              columns: 4

  # ── Vehicle Doors & Details ──
  - type: grid
    cards:
      - type: entities
        title: "Ajtók & Állapot"
        entities:
          - entity: binary_sensor.ioniq_5_front_left_door
            name: "Bal első"
          - entity: binary_sensor.ioniq_5_front_right_door
            name: "Jobb első"
          - entity: binary_sensor.ioniq_5_back_left_door
            name: "Bal hátsó"
          - entity: binary_sensor.ioniq_5_back_right_door
            name: "Jobb hátsó"
          - entity: binary_sensor.ioniq_5_trunk
            name: "Csomagtartó"
          - entity: binary_sensor.ioniq_5_hood
            name: "Motorháztető"
        grid_options:
          columns: 6

      - type: entities
        title: "Karbantartás"
        entities:
          - entity: binary_sensor.ioniq_5_tire_pressure_all
            name: "Gumi nyomás"
          - entity: binary_sensor.ioniq_5_brake_fluid_warning
            name: "Fék folyadék"
          - entity: binary_sensor.ioniq_5_washer_fluid_warning
            name: "Mosófolyadék"
          - entity: binary_sensor.ioniq_5_smart_key_battery_warning
            name: "Kulcs elem"
        grid_options:
          columns: 6

  # ── Scheduled Departures ──
  - type: grid
    cards:
      - type: entities
        title: "Időzített indulás"
        entities:
          - entity: sensor.ioniq_5_ev_first_scheduled_departure_time
            name: "1. indulás"
          - entity: sensor.ioniq_5_first_departure_days
            name: "1. napok"
          - entity: switch.ioniq_5_first_departure_climate
            name: "1. klíma"
          - entity: sensor.ioniq_5_ev_second_scheduled_departure_time
            name: "2. indulás"
          - entity: sensor.ioniq_5_second_departure_days
            name: "2. napok"
          - entity: switch.ioniq_5_second_departure_climate
            name: "2. klíma"
          - entity: switch.ioniq_5_off_peak_charge_only
            name: "Off-peak only"
          - entity: sensor.ioniq_5_ev_off_peak_start_time
            name: "Off-peak start"
          - entity: sensor.ioniq_5_ev_off_peak_end_time
            name: "Off-peak end"
        grid_options:
          columns: 6

      - type: history-graph
        entities:
          - entity: sensor.22k07_charging_station_charging_power
        title: "Töltési teljesítmény (24h)"
        hours_to_show: 24
        grid_options:
          columns: 6
