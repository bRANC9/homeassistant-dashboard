title: EV
path: ev
icon: mdi:car-electric
type: sections
theme: Helios
max_columns: 12
sections:
  # ── Vehicle Status ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\U0001F697 IONIQ 5"
        subtitle: >-
          Last update: {{ states('sensor.ioniq_5_last_updated_at') }}
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.ioniq_5_ev_battery_level') }}%"
          secondary: "{{ states('sensor.ioniq_5_ev_range') }} km"
          icon: mdi:car-electric
          icon_color: "{{ 'green' if states('sensor.ioniq_5_ev_battery_level')|int(0) > 80 else 'yellow' if states('sensor.ioniq_5_ev_battery_level')|int(0) > 40 else 'red' }}"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.ioniq_5_odometer') }} km"
          secondary: "Odometer"
          icon: mdi:counter
          icon_color: grey
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.ioniq_5_average_energy_consumption') }} Wh/km"
          secondary: "Avg Consumption"
          icon: mdi:chart-line
          icon_color: cyan
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: binary_sensor.ioniq_5_ev_battery_charge
          name: Charging
          icon: mdi:battery-charging
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: binary_sensor.ioniq_5_ev_battery_plug
          name: Plugged In
          icon: mdi:power-plug
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: binary_sensor.ioniq_5_locked
          name: Locked
          icon: mdi:car-door-lock
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: lock.ioniq_5_door_lock
          name: Door Lock
          icon: mdi:lock
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: switch.ioniq_5_ioniq_5_climate
          name: Climate
          icon: mdi:hvac
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: switch.ioniq_5_ioniq_5_ev_charging
          name: EV Charging
          icon: mdi:ev-station
        grid_options:
          columns: 4

  # ── Charging Station ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\u26A1 Charging Station"
        subtitle: "{{ states('sensor.ev_charger_status_text') }}"
        grid_options:
          columns: 12

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: switch.22k07_charging_station_start_stop
          name: Start/Stop
          icon: mdi:ev-station
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.22k07_charging_station_charging_power') }} W"
          secondary: "Power"
          icon: mdi:flash
          icon_color: yellow
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.22k07_charging_station_total_energy') }} kWh"
          secondary: "Total"
          icon: mdi:counter
          icon_color: blue
        grid_options:
          columns: 3

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('number.22k07_charging_station_charge_current') }}A"
          secondary: "Current"
          icon: mdi:current-ac
          icon_color: orange
        grid_options:
          columns: 3

      - type: custom:mushroom-number-card
        entity: number.22k07_charging_station_charge_current
        name: Charge Current (A)
        icon: mdi:current-ac
        display_mode: slider
        grid_options:
          columns: 12

  # ── Smart Charging ──
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: "\u2699\uFE0F Smart Charging"
        subtitle: ""
        grid_options:
          columns: 12

      - type: custom:mushroom-select-card
        entity: input_select.ev_charge_mode
        name: Mode
        icon: mdi:car-electric
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.ev_usable_surplus') }} kW"
          secondary: "Surplus"
          icon: mdi:solar-power
          icon_color: "{{ 'green' if states('sensor.ev_usable_surplus')|float(0) > 2 else 'yellow' if states('sensor.ev_usable_surplus')|float(0) > 0 else 'red' }}"
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.ev_target_soc_effective') }}%"
          secondary: "Target SOC"
          icon: mdi:flag-checkered
          icon_color: purple
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: entity_chip
        variables:
          entity: input_boolean.ev_force_charge_today
          name: Force Charge
          icon: mdi:ev-station
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.ev_power_kw') }} kW"
          secondary: "EV Power"
          icon: mdi:flash
          icon_color: yellow
        grid_options:
          columns: 4

      - type: custom:decluttering-card
        template: sensor_chip
        variables:
          primary: "{{ states('sensor.ev_charge_hours_remaining') }}h"
          secondary: "Time to Full"
          icon: mdi:timer-sand
          icon_color: cyan
        grid_options:
          columns: 4

  # ── Vehicle Doors & Details ──
  - type: grid
    cards:
      - type: entities
        title: "Ajtók & Állapot"
        entities:
          - entity: binary_sensor.ioniq_5_front_left_door
            name: "Bal első"
          - entity: binary_sensor.ioniq_5_front_right_door
            name: "Jobb első"
          - entity: binary_sensor.ioniq_5_back_left_door
            name: "Bal hátsó"
          - entity: binary_sensor.ioniq_5_back_right_door
            name: "Jobb hátsó"
          - entity: binary_sensor.ioniq_5_trunk
            name: "Csomagtartó"
          - entity: binary_sensor.ioniq_5_hood
            name: "Motorháztető"
        grid_options:
          columns: 6

      - type: entities
        title: "Karbantartás"
        entities:
          - entity: binary_sensor.ioniq_5_tire_pressure_all
            name: "Gumi nyomás"
          - entity: binary_sensor.ioniq_5_brake_fluid_warning
            name: "Fék folyadék"
          - entity: binary_sensor.ioniq_5_washer_fluid_warning
            name: "Mosófolyadék"
          - entity: binary_sensor.ioniq_5_smart_key_battery_warning
            name: "Kulcs elem"
        grid_options:
          columns: 6

  # ── Scheduled Departures ──
  - type: grid
    cards:
      - type: entities
        title: "Időzített indulás"
        entities:
          - entity: sensor.ioniq_5_ev_first_scheduled_departure_time
            name: "1. indulás"
          - entity: sensor.ioniq_5_first_departure_days
            name: "1. napok"
          - entity: switch.ioniq_5_first_departure_climate
            name: "1. klíma"
          - entity: sensor.ioniq_5_ev_second_scheduled_departure_time
            name: "2. indulás"
          - entity: sensor.ioniq_5_second_departure_days
            name: "2. napok"
          - entity: switch.ioniq_5_second_departure_climate
            name: "2. klíma"
          - entity: switch.ioniq_5_off_peak_charge_only
            name: "Off-peak only"
          - entity: sensor.ioniq_5_ev_off_peak_start_time
            name: "Off-peak start"
          - entity: sensor.ioniq_5_ev_off_peak_end_time
            name: "Off-peak end"
        grid_options:
          columns: 6

      - type: custom:mini-graph-card
        name: "Töltési teljesítmény (24h)"
        hours_to_show: 24
        line_width: 3
        font_size: 75
        animate: true
        show:
          labels: true
          legend: true
        entities:
          - entity: sensor.22k07_charging_station_charging_power
            name: Power
            color: "#ff9800"
        grid_options:
          columns: 6
