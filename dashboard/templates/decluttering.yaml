# ── Sensor chip: displays a sensor value with icon and color ──
sensor_chip:
  default:
    - icon_color: grey
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical

# ── Entity chip: clickable entity with toggle ──
entity_chip:
  card:
    type: custom:mushroom-entity-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    tap_action:
      action: toggle
    layout: vertical

# ── Entity chip display: entity display only (no tap_action) ──
entity_chip_display:
  card:
    type: custom:mushroom-entity-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    layout: vertical

# ── Action chip: button with perform-action tap ──
action_chip:
  default:
    - icon_color: grey
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    tap_action:
      action: perform-action
      perform_action: "[[perform_action]]"
      target:
        entity_id: "[[target_entity]]"
    layout: vertical

# ── Service tile: app/service status with colored icon ──
service_tile:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical

# ── Docker tile: TrueNAS app status with Start/Stop popup ──
docker_tile:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: "[[primary]]"
          size: wide
          content:
            type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Start
                    icon: mdi:play
                    icon_color: green
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: truenas_ce.app_start
                      target:
                        entity_id: "binary_sensor.truenas_apps_[[app_name]]"
                      confirmation: true
                  - type: custom:mushroom-template-card
                    primary: Stop
                    icon: mdi:stop
                    icon_color: red
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: truenas_ce.app_stop
                      target:
                        entity_id: "binary_sensor.truenas_apps_[[app_name]]"
                      confirmation: true
