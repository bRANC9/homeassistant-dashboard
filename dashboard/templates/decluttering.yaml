# ── Sensor chip: displays a sensor value with icon and color ──
sensor_chip:
  default:
    - icon_color: grey
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical

# ── Entity chip: clickable entity toggle ──
entity_chip:
  card:
    type: custom:mushroom-entity-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    tap_action:
      action: toggle
    layout: vertical

# ── Action chip: button with custom tap action ──
action_chip:
  default:
    - icon_color: grey
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    tap_action:
      action: perform-action
      perform_action: "[[perform_action]]"
      target:
        entity_id: "[[target_entity]]"
    layout: vertical

# ── Service tile: app status with colored icon ──
service_tile:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical
