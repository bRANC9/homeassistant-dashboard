# ── Sensor chip: displays a sensor value with icon and color ──
sensor_chip:
  default:
    - icon_color: grey
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical

# ── Entity chip: clickable entity with toggle ──
entity_chip:
  card:
    type: custom:mushroom-entity-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    tap_action:
      action: toggle
    layout: vertical

# ── Entity chip display: entity display only (no tap_action) ──
entity_chip_display:
  card:
    type: custom:mushroom-entity-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    layout: vertical

# ── Action chip: button with perform-action tap ──
action_chip:
  default:
    - icon_color: grey
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    tap_action:
      action: perform-action
      perform_action: "[[perform_action]]"
      target:
        entity_id: "[[target_entity]]"
    layout: vertical

# ── Service tile: app/service status with colored icon ──
service_tile:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical

# ── Docker tile: TrueNAS app status with Start/Stop/Restart popup ──
docker_tile:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: >-
      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
      {% set d = a if a else {} %}
      {% set v = d.get('[[app_name]]', {}) %}
      {% set s = v.get('state', 'N/A') %}
      {% set up = v.get('upgrade_available') %}
      {% if up %}{{ s }} •{% else %}{{ s }}{% endif %}
    icon: "[[icon]]"
    icon_color: >-
      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
      {% set d = a if a else {} %}
      {% set v = d.get('[[app_name]]', {}) %}
      {% set s = v.get('state') %}
      {% set up = v.get('upgrade_available') %}
      {% if up %}orange{% elif s == 'RUNNING' %}green{% elif s == 'DEPLOYING' %}orange{% elif s == 'CRASHED' %}purple{% elif s == 'STOPPED' %}red{% else %}grey{% endif %}
    layout: vertical
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: "[[primary]]"
          size: large
          content:
            type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: >-
                  [[primary]] —
                  {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                  {% set d = a if a else {} %}
                  {% set v = d.get('[[app_name]]', {}) %}
                  {% set s = v.get('state', 'N/A') %}
                  {% set up = v.get('upgrade_available') %}
                  {% if s == 'RUNNING' %}{% if up %}Frissíthető{% else %}Fut{% endif %}{% else %}{{ s }}{% endif %}
                subtitle: ""
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Start
                    icon: mdi:play-circle
                    icon_color: green
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: truenas_ce.app_start
                      target:
                        entity_id: "binary_sensor.truenas_apps_[[app_name]]"
                      confirmation: true
                  - type: custom:mushroom-template-card
                    primary: Stop
                    icon: mdi:stop-circle
                    icon_color: red
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: truenas_ce.app_stop
                      target:
                        entity_id: "binary_sensor.truenas_apps_[[app_name]]"
                      confirmation: true
                  - type: custom:mushroom-template-card
                    primary: Restart
                    icon: mdi:restart
                    icon_color: orange
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: script.truenas_app_restart
                      data:
                        entity_id: "binary_sensor.truenas_apps_[[app_name]]"
                      confirmation: true
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {{ v.get('human_version') or v.get('version', '?') }}
                    secondary: Verzió
                    icon: mdi:information
                    icon_color: blue
                    layout: vertical
                  - type: custom:mushroom-template-card
                    primary: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {{ v.get('containers', 0) }}
                    secondary: Containerek
                    icon: mdi:docker
                    icon_color: cyan
                    layout: vertical
              - type: horizontal-stack
                cards:
                  - type: custom:button-card
                    name: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {% set u = v.get('portal_url', '') %}
                      {% if u %}Portál{% else %}Nincs portál{% endif %}
                    label: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {% set u = v.get('portal_url', '') %}
                      {% if u %}{{ u }}{% else %}—{% endif %}
                    icon: mdi:web
                    show_state: false
                    tap_action:
                      action: >-
                        {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                        {% set d = a if a else {} %}
                        {% set u = d.get('[[app_name]]', {}).get('portal_url', '') %}
                        {% if u %}url{% else %}none{% endif %}
                      url_path: >-
                        {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                        {% set d = a if a else {} %}
                        {{ d.get('[[app_name]]', {}).get('portal_url', 'about:blank') }}
                  - type: custom:button-card
                    name: Frissítés
                    label: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {% set nv = v.get('latest_version') %}
                      {% set hv = v.get('docker_hub_version') %}
                      {% set up = v.get('upgrade_available') %}
                      {% if up and (nv or hv) %}{{ nv or hv }}{% elif up %}Elérhető{% else %}Nincs{% endif %}
                    icon: mdi:update
                    show_state: false
                    tap_action:
                      action: >-
                        {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                        {% set d = a if a else {} %}
                        {% set v = d.get('[[app_name]]', {}) %}
                        {% set url = v.get('docker_hub_url', '') %}
                        {% if url %}url{% else %}none{% endif %}
                      url_path: >-
                        {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                        {% set d = a if a else {} %}
                        {{ d.get('[[app_name]]', {}).get('docker_hub_url', 'about:blank') }}
                  - type: custom:button-card
                    name: Docker Hub
                    label: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {% set img = v.get('docker_image', '') %}
                      {% if img %}{{ img }}{% else %}—{% endif %}
                    icon: mdi:open-in-new
                    show_state: false
                    tap_action:
                      action: >-
                        {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                        {% set d = a if a else {} %}
                        {% set url = d.get('[[app_name]]', {}).get('docker_hub_url', '') %}
                        {% if url %}url{% else %}none{% endif %}
                      url_path: >-
                        {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                        {% set d = a if a else {} %}
                        {{ d.get('[[app_name]]', {}).get('docker_hub_url', 'about:blank') }}
              - type: custom:mushroom-entity-card
                entity: "binary_sensor.truenas_apps_[[app_name]]"
                name: Binary (CE)
                icon: mdi:checkbox-marked-circle
