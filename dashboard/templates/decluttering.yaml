# ── Sensor chip: displays a sensor value with icon and color ──
sensor_chip:
  default:
    - icon_color: grey
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical

# ── Entity chip: clickable entity with toggle ──
entity_chip:
  card:
    type: custom:mushroom-entity-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    tap_action:
      action: toggle
    layout: vertical

# ── Entity chip display: entity display only (no tap_action) ──
entity_chip_display:
  card:
    type: custom:mushroom-entity-card
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    layout: vertical

# ── Action chip: button with perform-action tap ──
action_chip:
  default:
    - icon_color: grey
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    tap_action:
      action: perform-action
      perform_action: "[[perform_action]]"
      target:
        entity_id: "[[target_entity]]"
    layout: vertical

# ── Service tile: app/service status with colored icon ──
service_tile:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: "[[secondary]]"
    icon: "[[icon]]"
    icon_color: "[[icon_color]]"
    layout: vertical

# ── Docker tile: TrueNAS app status with Start/Stop/Restart popup ──
docker_tile:
  card:
    type: custom:mushroom-template-card
    primary: "[[primary]]"
    secondary: >-
      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
      {% set d = a if a else {} %}
      {{ d.get('[[app_name]]', {}).get('state', 'N/A') }}
    icon: "[[icon]]"
    icon_color: >-
      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
      {% set d = a if a else {} %}
      {% set s = d.get('[[app_name]]', {}).get('state') %} 
      {% if s == 'RUNNING' %} green {% elif s == 'DEPLOYING' %} orange {% elif s == 'CRASHED' %} purple {% elif s == 'STOPPED' %} red {% else %} grey {% endif %}
    layout: vertical
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: "[[primary]]"
          size: wide
          content:
            type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Start
                    icon: mdi:play-circle
                    icon_color: green
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: truenas_ce.app_start
                      target:
                        entity_id: "binary_sensor.truenas_apps_[[app_name]]"
                      confirmation: true
                  - type: custom:mushroom-template-card
                    primary: Stop
                    icon: mdi:stop-circle
                    icon_color: red
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: truenas_ce.app_stop
                      target:
                        entity_id: "binary_sensor.truenas_apps_[[app_name]]"
                      confirmation: true
                  - type: custom:mushroom-template-card
                    primary: Restart
                    icon: mdi:restart
                    icon_color: orange
                    layout: vertical
                    tap_action:
                      action: perform-action
                      perform_action: script.truenas_app_restart
                      data:
                        entity_id: "binary_sensor.truenas_apps_[[app_name]]"
                      confirmation: true
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {{ d.get('[[app_name]]', {}).get('state', 'N/A') }}
                    icon: mdi:information
                    icon_color: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set s = d.get('[[app_name]]', {}).get('state') %}
                      {% if s == 'RUNNING' %} green {% elif s == 'DEPLOYING' %} orange {% elif s == 'CRASHED' %} purple {% elif s == 'STOPPED' %} red {% else %} grey {% endif %}
                  - type: custom:button-card
                    name: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {% set u = v.get('portal_url', '') %}
                      {% if u %}{{ u }}{% else %}
                        {% set p = v.get('ports', []) %}
                        {% if p %}:{{ p | join(', :') }}{% else %}—{% endif %}
                      {% endif %}
                    icon: mdi:web
                    show_state: false
                    tap_action:
                      action: url
                      url_path: "{{ state_attr('sensor.truenas_apps_state', 'apps').get('[[app_name]]', {}).get('portal_url', '') }}"
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {{ v.get('human_version') or v.get('version', '?') }}
                    secondary: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {{ v.get('containers', 0) }} container(s)
                    icon: mdi:docker
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% if d.get('[[app_name]]', {}).get('upgrade_available') %}Available{% else %}Up to date{% endif %}
                    secondary: Update
                    icon: mdi:update
                    icon_color: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% if d.get('[[app_name]]', {}).get('upgrade_available') %} orange {% else %} green {% endif %}
                  - type: custom:mushroom-template-card
                    primary: >-
                      {% set a = state_attr('sensor.truenas_apps_state', 'apps') %}
                      {% set d = a if a else {} %}
                      {% set v = d.get('[[app_name]]', {}) %}
                      {{ v.get('latest_version', '?') }}
                    secondary: Latest
                    icon: mdi:cloud-download
              - type: custom:mushroom-entity-card
                entity: "binary_sensor.truenas_apps_[[app_name]]"
                name: Binary (CE)
                icon: mdi:checkbox-marked-circle
