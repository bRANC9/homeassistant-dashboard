rest:
  - resource: "https://192.168.1.250:444/api/v2.0/apps"
    headers:
      Authorization: "Bearer REDACTED"
    scan_interval: 30
    sensor:
      - name: "truenas_app_homeassistant"
        value_template: "{{ value_json | selectattr('id', 'eq', 'homeassistant') | map(attribute='state') | first | default('unknown') }}"
