version: "3.8"

services:
  webhook:
    image: ghcr.io/branc9/homeassistant-dashboard/ha-dashboard-webhook:latest
    container_name: ha-dashboard-webhook
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./hooks.json:/etc/webhook/hooks.json
      # HA config könyvtár — TrueNAS dataset mount
      - ${HA_CONFIG_PATH}:/ha-config
      # Deployment checkout
      - deploy-data:/deploy/repo
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - HA_CONFIG_PATH=/ha-config
      - HA_TOKEN=${HA_TOKEN}
      - HA_URL=${HA_URL:-http://localhost:8123}
    command: "-hooks /etc/webhook/hooks.json -verbose"

  watchtower:
    image: containrrr/watchtower
    container_name: ha-dashboard-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
    command: ha-dashboard-webhook

volumes:
  deploy-data:
    driver: local
